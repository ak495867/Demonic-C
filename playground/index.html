<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Demonic C Playground</title><style>body{font-family:system-ui;margin:2rem;max-width:72rem}textarea{width:100%;height:20rem;font-family:monospace}button{padding:.6rem 1rem;margin:.5rem 0}pre{background:#111;color:#eee;padding:1rem;min-height:6rem}</style></head><body><h1>Demonic C Playground</h1><textarea id="source">fn main() -> int {
    println("Hello from Demonic C!");
    return 0;
}</textarea><br><button id="run">Run</button><pre id="output"></pre><script>document.getElementById("run").onclick=async()=>{const source=document.getElementById("source").value;const response=await fetch("/dmc/compile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({source:source})});const data=await response.json();if(data.error){document.getElementById("output").textContent="Error: "+data.error;}else{document.getElementById("output").textContent=data.output||data.error||"";}};</script></body></html>
